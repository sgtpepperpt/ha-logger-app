name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly: hassfest and HACS change their rules upstream
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # Checks the repo too: description, topics, issues on, brand/icon.png.
      - uses: hacs/action@main
        with:
          category: integration
