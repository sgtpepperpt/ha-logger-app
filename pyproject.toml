# Tooling only (this repo is a Home Assistant custom integration, not a package):
# ruff (lint + format, HA core's style) and pytest (pytest-homeassistant-custom-component).

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "FURB",
  "I",
  "LOG",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "E501", # the formatter owns line length
]

[tool.ruff.lint.isort]
# HA core's import order: stdlib · third party · homeassistant + this integration.
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
